<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vremenko™ - Lokalno vreme</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      transition: background-color 0.8s ease;
    }

    .container {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 0.5rem;
      width: 140px;
      height: 200px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: absolute;
      transition: transform 0.5s ease, opacity 0.5s ease;
      cursor: pointer;
    }

    .card.selected {
      transform: scale(1.2) !important;
      z-index: 10;
      opacity: 1 !important;
    }

    .card.current {
      animation: glowPulse 2s ease-in-out infinite;
      transition: transform 0.5s ease, opacity 0.5s ease, box-shadow 0.5s ease;
    }

    @keyframes glowPulse {
      0%, 100% {
        box-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
      }
      50% {
        box-shadow: 0 0 15px var(--glow-color), 0 0 30px var(--glow-color);
      }
    }

    .card.clear-sky { border: 3px solid #FFD700; }
    .card.few-clouds { border: 3px solid #87CEEB; }
    .card.scattered-clouds { border: 3px solid #B0C4DE; }
    .card.broken-clouds { border: 3px solid #B0C4DE; }
    .card.shower-rain { border: 3px solid #4682B4; }
    .card.rain { border: 3px solid #4682B4; }
    .card.thunderstorm { border: 3px solid #800000; }
    .card.snow { border: 3px solid #00CED1; }
    .card.mist, .card.haze, .card.fog { border: 3px solid #A9A9A9; }
    .card.unknown { border: 3px solid #CCCCCC; }

    .location {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 0.05rem;
    }

    .date, .time, .description {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.05rem;
    }

    .time-context {
      font-size: 0.70rem;
      color: #666;
      margin-bottom: 0.50rem;
      overflow-wrap: break-word;
      padding-bottom: 0.2rem;
    }

    .temperature {
      font-size: 1.4rem;
      margin: 0.05rem 0;
    }

    .weather-icon {
      width: 70px;
      height: 70px;
      margin: 0.05rem auto;
      display: block;
    }

    .spinner {
      font-size: 1.2rem;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #get-location-btn {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: none;
    }

    .game-controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 80vmin;
      z-index: 1000;
    }

    .control-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      padding: 3.5px 10px;
      border-radius: 8px;
      font-size: 0.85em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      touch-action: manipulation;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      min-width: 100px;
    }

    .control-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-btn.zenkoda-btn {
      background: linear-gradient(135deg, #483d8b, #6a5acd);
      font-family: 'Arial', sans-serif;
    }

    .control-btn.zenkoda-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      filter: brightness(1.2);
    }

    @media (max-width: 600px) {
      .container {
        width: 70vmin;
        height: 70vmin;
      }

      .card {
        width: 120px;
        height: 180px;
        padding: 0.4rem;
      }

      .location, .date, .description {
        font-size: 0.75rem;
      }

      .time-context {
        font-size: 0.7rem;
        overflow-wrap: break-word;
        padding-bottom: 0.1rem;
      }

      .time {
        font-size: 0.7rem;
      }

      .temperature {
        font-size: 1.2rem;
      }

      .weather-icon {
        width: 58px;
        height: 58px;
      }

      .game-controls {
        width: 70vmin;
        bottom: 8px;
      }

      .control-btn {
        padding: 3px 8px;
        font-size: 0.75em;
        min-width: 90px;
      }
    }

    @media (max-width: 480px) {
      .game-controls {
        width: 70vmin;
        bottom: 6px;
      }

      .control-btn {
        padding: 2.5px 6px;
        font-size: 0.7em;
        min-width: 80px;
      }
    }

    @media (max-width: 360px) {
      .game-controls {
        width: 70vmin;
        bottom: 4px;
      }

      .control-btn {
        padding: 2px 5px;
        font-size: 0.65em;
        min-width: 70px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) and (max-width: 768px) {
      .game-controls {
        width: 20px;
        bottom: auto;
        right: 10px;
        left: auto;
        transform: translateX(0);
        flex-direction: column;
      }

      .control-btn {
        padding: 2px 2px;
        font-size: 0.55em;
        width: 100%;
        min-width: auto;
      }
    }
  </style>
</head>

<body>
  <button id="get-location-btn">Dovoli lokacijo</button>
  <div class="container" id="weather-container">
    <div class="spinner">Nalaganje vremena...</div>
  </div>  
  <div id="radar-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1001;">
    <div style="position: relative; max-width: 90%; max-height: 90%; background: white; border-radius: 10px; overflow: hidden; text-align: center;">
      <span id="close-popup" style="position: absolute; top: 10px; right: 10px; font-size: 30px; cursor: pointer; color: black;">&times;</span>
      <img src="https://meteo.arso.gov.si/uploads/probase/www/observ/radar/si0-rm-anim.gif" alt="Radar Animation" style="max-width: 100%; max-height: calc(100vh - 20px); display: block;">
    </div>
  </div>

  <script>
    const API_KEY = '06251ca46eeed8b7d95b820408f44ef3';
    const container = document.getElementById('weather-container');
    const radius = 40;
    const maxCards = 24;
    let currentIndex = 0;
    let touchStartX = 0;
    let touchStartY = 0;
    const refreshInterval = 10 * 60 * 1000;

    const weatherIconMap = {
      'clear sky': 'animated/day.svg',
      'few clouds': 'animated/cloudy-day-1.svg',
      'scattered clouds': 'animated/cloudy-day-2.svg',
      'broken clouds': 'animated/cloudy.svg',
      'shower rain': 'animated/rainy-1.svg',
      'rain': 'animated/rainy-3.svg',
      'light rain': 'animated/rainy-1.svg',
      'thunderstorm': 'animated/thunder.svg',
      'snow': 'animated/snowy-1.svg',
      'mist': 'animated/cloudy.svg',
      'haze': 'animated/cloudy.svg',
      'fog': 'animated/cloudy.svg'
    };

    function translateDescription(desc) {
      const map = {
        'clear sky': 'jasno nebo',
        'few clouds': 'rahlo oblačno',
        'scattered clouds': 'razpršeni oblaki',
        'overcast clouds': 'razpršeni oblaki',
        'broken clouds': 'oblačno',
        'shower rain': 'plohe',
        'rain': 'dež',
        'light rain': 'rahel dež',
        'moderate rain': 'rahel dež',
        'thunderstorm': 'nevihta',
        'snow': 'sneg',
        'mist': 'meglica',
        'haze': 'meglica',
        'fog': 'megla'
      };
      return map[desc.toLowerCase()] || desc;
    }

 function formatDate(date) {
  const days = ['nedelja', 'ponedeljek', 'torek', 'sreda', 'četrtek', 'petek', 'sobota'];
  const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  const dayName = days[date.getDay()];
  const day = date.getDate();
  const monthName = months[date.getMonth()];

  return `${dayName}, ${day}. ${monthName}`;
}

    function getGlowColor(hour) {
      const day = { r: 0, g: 255, b: 255 }, night = { r: 30, g: 58, b: 138 };
      const t = (Math.cos((hour / 24) * 2 * Math.PI) + 1) / 2;
      const r = Math.round(night.r + (day.r - night.r) * t);
      const g = Math.round(night.g + (day.g - night.g) * t);
      const b = Math.round(night.b + (day.b - night.b) * t);
      return `rgb(${r},${g},${b})`;
    }

    function getTimeContext(ts, now) {
      const diff = Math.round((ts - now) / 3600);
      if (Math.abs(diff) < 1.5) return 'ZDAJ';
      return diff > 0 ? `ČEZ ${diff} UR` : `PRED ${-diff} URAMI`;
    }

    function setBackgroundByHour(hour) {
      const n = hour / 24;
      const b = n <= 0.5 ? n * 2 : (1 - n) * 2;
      const c = Math.round(b * 255);
      document.body.style.backgroundColor = `rgb(${c},${c},${c})`;
    }

    function positionCards(total) {
      const cards = document.querySelectorAll('.card');
      const step = (2 * Math.PI) / total;

      cards.forEach((card, i) => {
        const a = step * (i - currentIndex);
        const x = radius * Math.cos(a);
        const y = radius * Math.sin(a);
        const f = Math.cos(a);
        const s = 0.8 + 0.2 * f;
        const o = 0.6 + 0.4 * f;

        card.style.transform = `translate(${x}vmin, ${y}vmin) scale(${s})`;
        card.style.opacity = o;
        card.style.zIndex = Math.round(10 + 5 * f);

        card.classList.toggle('selected', i === currentIndex);
        card.classList.toggle('current', i === currentIndex);
      });

      const centerCard = cards[currentIndex];
      if (!centerCard) return;
      const h = parseInt(centerCard.querySelector('.time')?.textContent?.split(':')[0] || '0', 10);
      centerCard.style.setProperty('--glow-color', getGlowColor(h));
      setBackgroundByHour(h);
    }

    function displayHourlyWeather(data, city) {
      container.innerHTML = '';
      const now = Date.now() / 1000;
      const hours = [];
      const seen = new Set();

      for (const hour of data.list) {
        if (!seen.has(hour.dt) && hours.length < maxCards) {
          hours.push(hour);
          seen.add(hour.dt);
        }
      }

      let closest = 0, min = Infinity;
      hours.forEach((h, i) => {
        const d = Math.abs(h.dt - now);
        if (d < min) { min = d; closest = i; }
      });

      hours.forEach(hour => {
        const temp = Math.round(hour.main.temp);
        const desc = hour.weather[0].description;
        const time = new Date(hour.dt * 1000);
        const hourStr = time.toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit' });
        const dateStr = formatDate(time);
        const icon = weatherIconMap[desc.toLowerCase()] || 'animated/cloudy.svg';
        const ctx = getTimeContext(hour.dt, now);
        const weatherClass = desc.toLowerCase().replace(/\s+/g, '-');

        const card = document.createElement('div');
        card.className = `card ${weatherClass || 'unknown'}`;
        card.innerHTML = `
          <div class="location">${city}</div>
          <div class="date">${dateStr}</div>
          <div class="time">${hourStr}</div>
          <img src="${icon}" class="weather-icon" alt="${desc}">
          <div class="temperature">${temp}°C</div>
          <div class="description">${translateDescription(desc)}</div>
          <div class="time-context">${ctx}</div>`;
        container.appendChild(card);
      });

      currentIndex = closest;

      // Add click event listeners to weather icons, but only trigger for selected card
      document.querySelectorAll('.weather-icon').forEach(icon => {
        icon.addEventListener('click', (e) => {
          const card = icon.closest('.card');
          if (card && card.classList.contains('selected')) {
            showRadarPopup();
          }
        });
      });

      positionCards(hours.length);
    }

    function fetchHourlyWeather(lat, lon) {
      const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`;
      fetch(url)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          localStorage.setItem('hourlyWeatherData', JSON.stringify(data));
          localStorage.setItem('userLocation', JSON.stringify({ lat, lon }));
          displayHourlyWeather(data, data.city.name);
        })
        .catch(() => {
          container.innerHTML = '<div class="spinner">Ni mogoče naložiti vremena.</div>';
        });
    }

    function getWeather() {
      const cachedLocation = localStorage.getItem('userLocation');
      if (cachedLocation) {
        const { lat, lon } = JSON.parse(cachedLocation);
        fetchHourlyWeather(lat, lon);
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            fetchHourlyWeather(pos.coords.latitude, pos.coords.longitude);
          },
          () => {
            container.innerHTML = '<div class="spinner">Prosimo, omogočite dostop do lokacije.</div>';
          }
        );
      } else {
        container.innerHTML = '<div class="spinner">Geolokacija ni podprta.</div>';
      }
    }

    function startAutoRefresh() {
      setInterval(() => {
        const cachedLocation = localStorage.getItem('userLocation');
        if (cachedLocation) {
          const { lat, lon } = JSON.parse(cachedLocation);
          fetchHourlyWeather(lat, lon);
        }
      }, refreshInterval);
    }

    function navigate(dir) {
      const total = document.querySelectorAll('.card').length;
      currentIndex = (currentIndex + dir + total) % total;
      positionCards(total);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    container.addEventListener('wheel', e => {
      e.preventDefault();
      navigate(e.deltaY > 0 ? 1 : -1);
    });

    container.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    });

    container.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        navigate(dx > 0 ? -1 : 1);
        touchStartX = t.clientX;
      } else if (Math.abs(dy) > 50) {
        navigate(dy > 0 ? 1 : -1);
        touchStartY = t.clientY;
      }
    });

    function showRadarPopup() {
      document.getElementById('radar-popup').style.display = 'flex';
    }

    window.onload = () => {
      const btn = document.getElementById('get-location-btn');
      const stored = localStorage.getItem('userLocation');

      if (!stored) {
        btn.style.display = 'block';
        btn.addEventListener('click', () => {
          btn.style.display = 'none';
          getWeather();
          startAutoRefresh();
        });
      } else {
        getWeather();
        startAutoRefresh();
      }

      // Watch for location changes
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          pos => {
            const cachedLocation = localStorage.getItem('userLocation');
            const newLat = pos.coords.latitude;
            const newLon = pos.coords.longitude;
            if (cachedLocation) {
              const { lat, lon } = JSON.parse(cachedLocation);
              // Check if the location has changed significantly (e.g., 0.01 degrees)
              if (Math.abs(newLat - lat) > 0.01 || Math.abs(newLon - lon) > 0.01) {
                fetchHourlyWeather(newLat, newLon);
              }
            } else {
              fetchHourlyWeather(newLat, newLon);
            }
          },
          () => {
            container.innerHTML = '<div class="spinner">Prosimo, omogočite dostop do lokacije.</div>';
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
        );
      }

      // Add close event for popup
      document.getElementById('close-popup').addEventListener('click', () => {
        document.getElementById('radar-popup').style.display = 'none';
      });

      // Optional: Close on outside click
      document.getElementById('radar-popup').addEventListener('click', (e) => {
        if (e.target === document.getElementById('radar-popup')) {
          document.getElementById('radar-popup').style.display = 'none';
        }
      });
    };
  </script>

</body>

</html>
